<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" fill="none">
  <title>Sudoku Solver preview</title>
  <desc>Sudoku board and Solve and Reset controls in the left panel, with source code in an equally tall right panel.</desc>
  <rect width="800" height="450" fill="#052e16"/>
  <g fill="#14532d" stroke="#15803d" stroke-width="2">
    <rect x="20" y="20" width="370" height="410" rx="14"/>
    <rect x="410" y="20" width="370" height="410" rx="14"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#dcfce7">
    <text x="42" y="46" font-size="8" letter-spacing="2">SUDOKU SOLVER</text>
    <text x="42" y="69" font-size="18" font-weight="bold">Solve Sudoku puzzles with clarity.</text>
    <text x="42" y="84" font-size="9">Enter digits 1 through 9. Invalid input is ignored automatically.</text>
  </g>
  <g stroke="#33cc33"><path d="M91 92v198 M91 92h198" stroke-width="2"/><path d="M113 92v198 M91 114h198" stroke-width="0.7"/><path d="M135 92v198 M91 136h198" stroke-width="0.7"/><path d="M157 92v198 M91 158h198" stroke-width="2"/><path d="M179 92v198 M91 180h198" stroke-width="0.7"/><path d="M201 92v198 M91 202h198" stroke-width="0.7"/><path d="M223 92v198 M91 224h198" stroke-width="2"/><path d="M245 92v198 M91 246h198" stroke-width="0.7"/><path d="M267 92v198 M91 268h198" stroke-width="0.7"/><path d="M289 92v198 M91 290h198" stroke-width="2"/></g>
  <g font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#dcfce7">
    <text x="102" y="108">5</text><text x="124" y="108">3</text><text x="190" y="108">7</text>
    <text x="102" y="130">6</text><text x="168" y="130">1</text><text x="190" y="130">9</text><text x="212" y="130">5</text>
    <text x="124" y="152">9</text><text x="146" y="152">8</text><text x="256" y="152">6</text>
    <text x="102" y="174">8</text><text x="190" y="174">6</text><text x="278" y="174">3</text>
    <text x="102" y="196">4</text><text x="168" y="196">8</text><text x="212" y="196">3</text><text x="278" y="196">1</text>
    <text x="102" y="218">7</text><text x="190" y="218">2</text><text x="278" y="218">6</text>
    <text x="124" y="240">6</text><text x="234" y="240">2</text><text x="256" y="240">8</text>
    <text x="168" y="262">4</text><text x="190" y="262">1</text><text x="212" y="262">9</text><text x="278" y="262">5</text>
    <text x="190" y="284">8</text><text x="256" y="284">7</text><text x="278" y="284">9</text>
  </g>
  <rect x="42" y="309" width="326" height="99" rx="10" stroke="#15803d"/>
  <g font-family="Arial, sans-serif" fill="#dcfce7">
    <text x="55" y="330" font-size="8" letter-spacing="1.5">CONTROLS</text>
    <text x="55" y="348" font-size="10">Solve fills in the puzzle. Reset clears the board.</text>
    <rect x="55" y="362" width="48" height="24" rx="4" fill="#166534" stroke="#4ade80"/>
    <rect x="112" y="362" width="48" height="24" rx="4" fill="#166534" stroke="#4ade80"/>
    <text x="66" y="378" font-size="10">Solve</text><text x="123" y="378" font-size="10">Reset</text>
    <text x="430" y="48" font-size="11" letter-spacing="1.5">SUDOKU SOLVER SOURCE</text>
  </g>
  <rect x="430" y="65" width="330" height="343" rx="8" fill="#052e16" stroke="#15803d" stroke-width="2"/>
  <g font-family="monospace" font-size="10" fill="#bbf7d0">
    <text x="445" y="88">SudokuSolver.jsx</text>
    <text x="445" y="113">import React, { useMemo, useState }</text>
    <text x="445" y="130">  from "react";</text>
    <text x="445" y="156">import {</text>
    <text x="445" y="173">  isValidGrid,</text>
    <text x="445" y="190">  solveSudoku,</text>
    <text x="445" y="207">  toNumberGrid,</text>
    <text x="445" y="224">  toUiGrid,</text>
    <text x="445" y="241">} from "./sudoku/solver";</text>
    <text x="445" y="275">export default function SudokuSolver() {</text>
    <text x="445" y="301">  const emptyGrid = useMemo(</text>
    <text x="445" y="318">    () =&gt; Array.from({ length: 9 },</text>
    <text x="445" y="335">      () =&gt; Array(9).fill("")),</text>
    <text x="445" y="352">    []</text>
    <text x="445" y="369">  );</text>
    <text x="445" y="395">  // Validate and solve the puzzle.</text>
  </g>
  <rect x="750" y="77" width="4" height="319" rx="2" fill="#14532d"/>
  <rect x="750" y="80" width="4" height="74" rx="2" fill="#86efac"/>
</svg>
