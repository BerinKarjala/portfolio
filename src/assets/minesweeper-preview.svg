<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" fill="none">
  <title>Minesweeper preview</title>
  <desc>Minesweeper board with a controls panel below it containing instructions, flags remaining, and a reset button.</desc>
  <defs>
    <pattern id="tiles" width="20" height="20" patternUnits="userSpaceOnUse" x="300" y="100">
      <rect x="1" y="1" width="18" height="18" fill="#24402f" stroke="#386348"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="#052e16"/>
  <rect x="215" y="20" width="370" height="410" rx="14" fill="#14532d" stroke="#15803d" stroke-width="2"/>
  <g font-family="Arial, sans-serif" fill="#dcfce7">
    <text x="237" y="46" font-size="8" letter-spacing="2">MINESWEEPER</text>
    <text x="237" y="69" font-size="18" font-weight="bold">Minesweeper</text>
    <text x="237" y="84" font-size="10">Clear the board without uncovering a mine.</text>
  </g>
  <rect x="296" y="96" width="208" height="208" rx="5" fill="#1e3326" stroke="#24402f" stroke-width="8"/>
  <rect x="300" y="100" width="200" height="200" fill="url(#tiles)"/>
  <rect x="237" y="318" width="326" height="90" rx="10" stroke="#15803d"/>
  <g font-family="Arial, sans-serif" fill="#dcfce7">
    <text x="250" y="337" font-size="8" letter-spacing="1.5">CONTROLS</text>
    <text x="250" y="354" font-size="10">Right click on a tile to add a flag to the board.</text>
    <text x="250" y="370" font-size="10">Flags left: 20</text>
    <rect x="250" y="380" width="130" height="20" rx="4" fill="#166534" stroke="#4ade80"/>
    <text x="259" y="394" font-size="10">Click to reset the board</text>
  </g>
</svg>
