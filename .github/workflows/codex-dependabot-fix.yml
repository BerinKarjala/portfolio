name: Codex Dependabot fix
# Compatibility entry point; labeled issues are handled once by Codex issue fix.
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Open in-progress issue to resolve or retry
        required: true
        type: number
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  resolve:
    uses: ./.github/workflows/codex-issue-fix.yml
    with:
      issue_number: ${{ inputs.issue_number }}
    secrets: inherit
