name: Page Builder checks

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "e2e/**"
      - "package*.json"
      - "*config*"
      - ".nvmrc"
      - "docs/page-builder/**"
      - ".github/workflows/page-builder.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: page-builder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page-builder-browser-evidence
          path: |
            playwright-report/
            test-results/
            e2e/page-builder-export.spec.js-snapshots/
          retention-days: 14
