name: Page Builder checks

on:
  pull_request:
  workflow_dispatch:
    inputs:
      browser_matrix:
        description: Browser coverage to run on cloud workers
        type: choice
        options: [default, full, landing]
        default: default

permissions:
  contents: read

concurrency:
  group: page-builder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ inputs.browser_matrix == 'landing' && 'Landing diagnostics (not a release gate)' || 'Page Builder release checks' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run check:page-builder
      - run: npm test
      - run: npm run build
      - run: npm run check:page-builder:build
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser regression matrix without retries
        if: inputs.browser_matrix != 'full' && inputs.browser_matrix != 'landing'
        run: npm run test:e2e:cloud
      - name: Complete browser matrix when explicitly selected
        if: inputs.browser_matrix == 'full'
        run: npm run test:e2e:full
      - name: Focused landing diagnostics (manual dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.browser_matrix == 'landing'
        run: npm run test:e2e:full -- e2e/landing-carousel.spec.js e2e/landing-carousel-motion.spec.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page-builder-browser-evidence
          path: |
            playwright-report/
            test-results/
            e2e/page-builder-export.spec.js-snapshots/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page-builder-export-baseline-review
          path: |
            e2e/page-builder-export.spec.js-snapshots/
            test-results/**/compiled-page-*-actual.png
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: page-builder-touch-failure
          path: |
            test-results/page-builder-canvas-touch-*/error-context.md
            test-results/page-builder-canvas-touch-*/test-failed-*.png
            test-results/page-builder-canvas-touch-*/trace.zip
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: page-builder-acceptance-failure
          path: |
            test-results/page-builder-acceptance-*/error-context.md
            test-results/page-builder-acceptance-*/test-failed-*.png
            test-results/page-builder-acceptance-*/trace.zip
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: page-builder-mouse-failure
          path: |
            test-results/page-builder-canvas-mouse-*/error-context.md
            test-results/page-builder-canvas-mouse-*/test-failed-*.png
            test-results/page-builder-canvas-mouse-*/trace.zip
          if-no-files-found: ignore
          retention-days: 14

  local-smoke-contract:
    name: Rehearse local smoke tier in cloud
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            studio13/package-lock.json
      - run: npm ci
      - name: Test browser routing and memory-pressure policy
        run: node --test scripts/run-browser-tests.test.cjs
      - run: npm ci --prefix studio13
      - run: npx playwright install --with-deps chromium
      - name: Exercise the same three smoke checks against isolated cloud dev servers
        run: npm run test:e2e:local
        env:
          BROWSER_SMOKE_START_SERVERS: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-smoke-contract-evidence
          path: test-results-local/
          if-no-files-found: ignore
          retention-days: 14
