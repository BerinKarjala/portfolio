name: Page Builder checks

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "e2e/**"
      - "scripts/check-page-builder-*.mjs"
      - "package*.json"
      - "*config*"
      - ".nvmrc"
      - "docs/page-builder/**"
      - ".github/workflows/page-builder.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: page-builder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run check:page-builder
      - run: npm test
      - run: npm run build
      - run: npm run check:page-builder:build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e -- e2e/page-builder-canvas.spec.js --grep "mouse palette" --workers=1 --retries=0
      - name: Wizard browser regression without retries
        run: npm run test:e2e -- e2e/page-builder-wizard.spec.js --workers=2 --retries=0
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page-builder-browser-evidence
          path: |
            playwright-report/
            test-results/
            e2e/page-builder-export.spec.js-snapshots/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page-builder-export-baseline-review
          path: |
            e2e/page-builder-export.spec.js-snapshots/
            test-results/**/compiled-page-*-actual.png
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: page-builder-touch-failure
          path: |
            test-results/page-builder-canvas-touch-*/error-context.md
            test-results/page-builder-canvas-touch-*/test-failed-*.png
            test-results/page-builder-canvas-touch-*/trace.zip
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: page-builder-acceptance-failure
          path: |
            test-results/page-builder-acceptance-*/error-context.md
            test-results/page-builder-acceptance-*/test-failed-*.png
            test-results/page-builder-acceptance-*/trace.zip
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: page-builder-mouse-failure
          path: |
            test-results/page-builder-canvas-mouse-*/error-context.md
            test-results/page-builder-canvas-mouse-*/test-failed-*.png
            test-results/page-builder-canvas-mouse-*/trace.zip
          if-no-files-found: ignore
          retention-days: 14
