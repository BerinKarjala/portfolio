name: CSS Studio private canary
on:
  push:
    branches: [css-studio-canary]
    paths:
      - "server/css-studio/**"
      - "src/shared/**"
      - "scripts/*css-studio-canary*"
      - "package*.json"
      - ".nvmrc"
      - ".github/workflows/css-studio-canary.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: css-studio-private-canary-global
  cancel-in-progress: false
jobs:
  verify-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm test -- server/css-studio scripts/check-css-studio-canary.test.mjs scripts/deploy-css-studio-canary.test.mjs
      - run: npm run test:css-studio:server
      - name: Deploy and verify at most two private quota-accounted fixtures
        run: node scripts/deploy-css-studio-canary.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
      - name: Retain public model-schema contract only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: css-studio-model-schema-contract
          path: artifacts/css-studio-canary/gpt-oss-schema-contract.json
          if-no-files-found: ignore
          retention-days: 7
