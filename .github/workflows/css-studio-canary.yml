name: CSS Studio private canary
on:
  push:
    branches: [css-studio-canary]
    paths:
      - "server/css-studio/**"
      - "src/shared/**"
      - "scripts/*css-studio-canary*"
      - "package*.json"
      - ".nvmrc"
      - ".github/workflows/css-studio-canary.yml"
  workflow_dispatch:
    inputs:
      check:
        description: "Private check (proxy/image-info make no model calls)"
        type: choice
        options: [proxy, image-info, theme]
        default: proxy
permissions:
  contents: read
concurrency:
  group: css-studio-private-canary-global
  cancel-in-progress: false
jobs:
  verify-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm test -- server/css-studio scripts/check-css-studio-canary.test.mjs scripts/deploy-css-studio-canary.test.mjs scripts/check-css-studio-proxy.test.mjs scripts/deploy-css-studio-proxy.test.mjs scripts/check-css-studio-image-readiness.test.mjs scripts/probe-css-studio-image-info.test.mjs
      - run: npm run test:css-studio:server
      - name: Install Chromium for session-only verification
        if: github.event_name == 'workflow_dispatch' && (inputs.check == 'proxy' || inputs.check == 'image-info')
        run: npx --no-install playwright install --with-deps chromium
      - name: Verify private proxy identity and cross-site rejection without inference
        if: github.event_name == 'workflow_dispatch' && inputs.check == 'proxy'
        run: node scripts/deploy-css-studio-proxy.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
      - name: Verify free Images metadata without inference or transformations
        if: github.event_name == 'workflow_dispatch' && inputs.check == 'image-info'
        run: node scripts/probe-css-studio-image-info.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
      - name: Deploy and verify at most two private quota-accounted fixtures
        if: github.event_name != 'workflow_dispatch' || inputs.check == 'theme'
        run: node scripts/deploy-css-studio-canary.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
      - name: Retain public model-schema contract only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: css-studio-model-schema-contract
          path: artifacts/css-studio-canary/gpt-oss-schema-contract.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain safe account visibility and metadata-probe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: css-studio-image-info
          path: |
            artifacts/css-studio-image-readiness/account.json
            artifacts/css-studio-image-info/info.json
          if-no-files-found: ignore
          retention-days: 7
