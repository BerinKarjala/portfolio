name: Security automation checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Automation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node --test scripts/*dependabot*.test.cjs scripts/issue-automation.test.cjs scripts/pr-working-methods.test.cjs
      - name: Check workflow syntax and shell scripts
        env:
          GOBIN: ${{ runner.temp }}/actionlint-bin
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$GOBIN/actionlint" \
            .github/workflows/codex-dependabot-fix.yml \
            .github/workflows/dependabot-issue-sync.yml \
            .github/workflows/weekly-security.yml \
            .github/workflows/security-automation-checks.yml
          "$GOBIN/actionlint" \
            .github/workflows/weekly-issue-report.yml \
            .github/workflows/page-builder.yml \
            .github/workflows/css-studio-browser.yml \
            .github/workflows/css-studio-server.yml \
            .github/workflows/studio-dependencies.yml \
            .github/workflows/working-methods.yml
