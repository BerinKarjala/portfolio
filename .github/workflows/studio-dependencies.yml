name: Studio dependency checks

on:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_test_studio:
        description: 'Deploy the isolated Content Agent test Studio after validation'
        type: boolean
        default: false
      expected_commit:
        description: 'Full reviewed commit SHA (required for deployment)'
        type: string
        required: false
      confirmation:
        description: 'Type deploy-content-agent-test to confirm deployment'
        type: string
        required: false

permissions:
  contents: read

jobs:
  studio:
    name: Studio dependency and build checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: studio13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            studio13/package-lock.json
      - name: Install shared PostCSS dependencies
        run: npm ci
        working-directory: .
      - run: npm ci
      - run: npm run test:dependencies
      - run: npm run test:project-links
      - run: npm run test:author-schema
      - run: npm run test:studio-version
      - run: node --test --test-concurrency=1 scripts/test-studio-deployment-guard.test.cjs
      - run: npm run test:test-studio
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - run: npm run build:test-studio
      - name: Check offline Studio browser routing
        run: node --test scripts/test-studio-network.test.cjs
        working-directory: .
      - name: Install Chromium for offline Studio smoke
        run: npx playwright install --with-deps chromium
        working-directory: .
      - name: Smoke built test Studio with synthetic API responses
        run: node scripts/test-studio-browser.cjs
        working-directory: .
      - name: Retain validated test Studio build
        uses: actions/upload-artifact@v4
        with:
          name: content-agent-test-studio
          path: studio13/content-agent-test/dist/
          retention-days: 7
          if-no-files-found: error
      - name: Retain offline Studio failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: offline-test-studio-failure
          path: test-results/studio-offline-failure.png
          retention-days: 1
          if-no-files-found: ignore

  deploy-test-studio:
    name: Deploy isolated Content Agent test Studio
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_test_studio
    needs: studio
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: sanity-test-deploy
    permissions:
      contents: read
    defaults:
      run:
        working-directory: studio13
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Verify the reviewed commit and fixed test target
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/test-studio-deployment-guard.cjs
      - name: Install shared PostCSS dependencies without deploy credentials
        run: npm ci
        working-directory: .
      - name: Install Studio dependencies without deploy credentials
        run: npm ci
      - name: Retrieve the test Studio validated in this workflow run
        uses: actions/download-artifact@v4
        with:
          name: content-agent-test-studio
          path: studio13/content-agent-test/dist
      - name: Deploy only the isolated test Studio
        working-directory: studio13/content-agent-test
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_TEST_DEPLOY_TOKEN }}
        run: |
          if [ -z "$SANITY_AUTH_TOKEN" ]; then
            echo 'The sanity-test-deploy environment secret is missing.' >&2
            exit 1
          fi
          npx --no-install sanity deploy --no-build --url berinkarjala-content-agent-test --schema-required --no-auto-updates --yes
