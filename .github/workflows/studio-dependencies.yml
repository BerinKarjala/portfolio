name: Studio dependency checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  studio:
    name: Studio dependency and build checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: studio13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            studio13/package-lock.json
      - name: Install shared PostCSS dependencies
        run: npm ci
        working-directory: .
      - run: npm ci
      - run: npm run test:dependencies
      - run: npm run test:project-links
      - run: npm run test:author-schema
      - run: npm run test:test-studio
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - run: npm run build:test-studio
      - name: Check offline Studio browser routing
        run: node --test scripts/test-studio-network.test.cjs
        working-directory: .
      - name: Install Chromium for offline Studio smoke
        run: npx playwright install --with-deps chromium
        working-directory: .
      - name: Smoke built test Studio with synthetic API responses
        run: node scripts/test-studio-browser.cjs
        working-directory: .
      - name: Retain offline Studio failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: offline-test-studio-failure
          path: test-results/studio-offline-failure.png
          retention-days: 1
          if-no-files-found: ignore
