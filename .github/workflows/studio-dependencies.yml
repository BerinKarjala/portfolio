name: Studio dependency checks

on:
  pull_request:
    paths:
      - "studio13/**"
      - ".nvmrc"
      - ".github/workflows/studio-dependencies.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  studio:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: studio13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: studio13/package-lock.json
      - run: npm ci
      - run: npm run test:dependencies
      - run: npm audit --audit-level=moderate
      - run: npm run build
