name: Check Cloudflare access

on:
  push:
    branches: [css-studio-token-check]
    paths: [.github/workflows/cloudflare-token-check.yml]
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    name: Verify token and Worker binding
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check Cloudflare credentials without deploying
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          class CheckError extends Error {}
          const token = process.env.CLOUDFLARE_API_TOKEN?.trim();
          async function read(path, failure, maxBytes = 65536) {
            const response = await fetch("https://api.cloudflare.com/client/v4" + path, {
              method: "GET",
              headers: { Authorization: "Bearer " + token },
              redirect: "error",
              signal: AbortSignal.timeout(10000),
            });
            const reader = response.body.getReader();
            const parts = [];
            let size = 0;
            try {
              while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                size += value.byteLength;
                if (size > maxBytes) {
                  await reader.cancel();
                  throw new CheckError("Cloudflare returned an unexpectedly large response.");
                }
                parts.push(value);
              }
            } finally {
              reader.releaseLock();
            }
            let data;
            try {
              data = JSON.parse(await new Blob(parts).text());
            } catch {
              if (!response.ok) throw new CheckError(failure + " (HTTP " + response.status + ").");
              throw new CheckError("Cloudflare returned an unexpected response. Try again later.");
            }
            if (!response.ok || data?.success !== true) {
              const errors = Array.isArray(data?.errors) ? data.errors.flatMap((item) => [item, ...(Array.isArray(item?.error_chain) ? item.error_chain : [])]) : [];
              const ipRestriction = errors.some((item) => item?.code === 9109 && typeof item.message === "string" && /\bcannot use\b.*\btoken\b.*\b(?:location|ip)\b/i.test(item.message));
              if (ipRestriction) throw new CheckError("Cloudflare blocked the token from GitHub's network. Review Client IP address filtering on this token; token verification does not enforce that restriction.");
              const codes = [...new Set(errors.map((item) => item?.code).filter(Number.isSafeInteger))].slice(0, 3);
              throw new CheckError(failure + " (HTTP " + response.status + (codes.length ? "; Cloudflare code " + codes.join(", ") : "") + ").");
            }
            return data.result;
          }
          try {
            if (!token) throw new CheckError("GitHub secret CLOUDFLARE_API_TOKEN is missing or empty.");
            if (/\s/.test(token)) throw new CheckError("The saved value contains spaces within it. Update the GitHub secret with only the token value, without a command or Authorization header.");
            const identity = await read("/user/tokens/verify", "Cloudflare rejected the token. Check its value, expiry and activation time.");
            if (identity?.status !== "active") throw new CheckError("The Cloudflare token is not active. Check its expiry and activation time.");
            if (identity.not_before && (!Number.isFinite(Date.parse(identity.not_before)) || Date.parse(identity.not_before) > Date.now())) throw new CheckError("The token is not yet valid. Review its TTL start date in Cloudflare.");
            if (identity.expires_on && (!Number.isFinite(Date.parse(identity.expires_on)) || Date.parse(identity.expires_on) <= Date.now())) throw new CheckError("The token has expired. Review its TTL end date in Cloudflare.");
            console.log("PASS: Cloudflare accepts the saved token.");
            const probes = await Promise.allSettled([
              (async () => {
                const settings = await read("/accounts/d33da711f0acb00005de85f10c11ab0f/workers/scripts/css-studio-ai/settings", "The token is valid, but reading css-studio-ai failed. Check token scope and Workers Scripts permission.");
                if (!Array.isArray(settings?.bindings) || !settings.bindings.some((binding) => binding.type === "ai" && binding.name === "AI")) throw new CheckError("Worker access succeeded, but the Workers AI binding named AI is missing.");
                console.log("PASS: CSS Studio Worker access and AI binding verified.");
              })(),
              (async () => {
                await read("/accounts/d33da711f0acb00005de85f10c11ab0f/ai/models/search?per_page=1", "The token is valid, but reading the Workers AI model catalogue failed. Check token scope and Workers AI Read permission.", 4 * 1024 * 1024);
                console.log("PASS: Workers AI catalogue access verified without inference.");
              })(),
            ]);
            for (const result of probes) {
              if (result.status === "rejected") {
                console.error("::error::" + (result.reason instanceof CheckError ? result.reason.message : "The check could not complete. Check Cloudflare availability and retry."));
                process.exitCode = 1;
              }
            }
            console.log("No deployment or AI inference was performed. This check does not establish write permissions or budget readiness.");
          } catch (error) {
            console.error("::error::" + (error instanceof CheckError ? error.message : "The check could not complete. Check Cloudflare availability and retry."));
            process.exitCode = 1;
          }
          NODE
