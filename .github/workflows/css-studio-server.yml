name: CSS Studio server boundary
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: css-studio-server-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: CSS Studio server checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm test -- server/css-studio
      - run: npm run test:css-studio:server
      - name: Native local Images decoding without remote services
        run: node --test server/css-studio/runtime/images.runtime.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:css-studio:server:browser
