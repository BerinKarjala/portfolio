name: CSS Studio server boundary
on:
  pull_request:
    paths:
      - "server/css-studio/**"
      - "package*.json"
      - ".nvmrc"
      - ".github/workflows/css-studio-server.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: css-studio-server-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm test -- server/css-studio
      - run: npm run test:css-studio:server
      - run: npx playwright install --with-deps chromium
      - run: npm run test:css-studio:server:browser
